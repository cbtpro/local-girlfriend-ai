# Mac M2 虚拟女友 AI 配置

# AI 模型配置
ai:
  # 可选模型：
  # model: "ALIENTELLIGENCE/sarahv2:latest"
  # model: "qwen:7b-chat"           # Qwen 7B Chat 模型
  temperature: 1.0                # 生成多样性
  top_p: 0.95
  max_tokens: 512
  presence_penalty: 0.6
  frequency_penalty: 0.3

# 虚拟女友信息
girlfriend:
  name: "柔柔"                     # 女友名字
  age: 20
  personality: "性感、火辣、温柔体贴、聪慧可爱、活泼俏皮"  # 性格
  likes: ["电影", "游戏", "旅行"] # 爱好

# 语音设置
voice:
  tts_engine: "edge-tts"          # 文字转语音引擎
  tts_voice: "zh-CN-XiaoxiaoNeural"  # 中文女声（小晓 - 温柔可爱）
  tts_rate: 1.0                   # 语速
  asr_model: "base"               # 语音识别模型
  # 新增：离线配置
  offline_enabled: true               # 启用离线降级
  offline_engine: "pyttsx3"          # 离线引擎
  offline_voice: "com.apple.speech.synthesis.voice.Moira"  # Mac 本地女声
  offline_rate: 1.0                  # 离线语速

# 其他设置
system:
  save_conversations: true        # 保存对话记录
  conversation_dir: "./data/conversations"
  log_level: "INFO"